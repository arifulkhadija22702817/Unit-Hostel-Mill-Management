<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- মডার্ন গ্রেডিয়েন্ট (গভীর নীল থেকে পার্পল) -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- সোনালি অ্যাকসেন্ট -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- সাদা গ্রেডিয়েন্ট -->
    <radialGradient id="whiteGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.8" />
    </radialGradient>

    <!-- প্লেটের গ্রেডিয়েন্ট -->
    <radialGradient id="plateGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- ছায়া -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.2" />
    </filter>

    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <filter id="cutleryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ✅ অ্যাপের বেস স্কয়ার -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#appBg)" filter="url(#iconShadow)" />

  <!-- হালকা বর্ডার (গ্লাস ইফেক্ট) -->
  <rect x="30" y="30" width="452" height="452" rx="98" ry="98" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.15" />

  <!-- 🏠 পুরো গ্রুপ -->
  <g filter="url(#innerGlow)">
    
    <!-- ====== ঘর ====== -->
    <path d="
      M 140 345
      V 248
      L 256 142
      L 372 248
      V 345
      H 330
      V 300
      H 182
      V 345
      Z
    " fill="url(#whiteGlow)" stroke="url(#accentGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- দরজা -->
    <path d="M 224 345 V 278 H 288 V 345" fill="none" stroke="url(#accentGold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- দরজার হাতল -->
    <circle cx="278" cy="312" r="4" fill="url(#accentGold)" />

    <!-- জানালা (বাম) -->
    <rect x="170" y="232" width="28" height="28" rx="6" fill="none" stroke="url(#accentGold)" stroke-width="6" />
    <line x1="184" y1="232" x2="184" y2="260" stroke="url(#accentGold)" stroke-width="4" />
    <line x1="170" y1="246" x2="198" y2="246" stroke="url(#accentGold)" stroke-width="4" />

    <!-- জানালা (ডান) -->
    <rect x="314" y="232" width="28" height="28" rx="6" fill="none" stroke="url(#accentGold)" stroke-width="6" />
    <line x1="328" y1="232" x2="328" y2="260" stroke="url(#accentGold)" stroke-width="4" />
    <line x1="314" y1="246" x2="342" y2="246" stroke="url(#accentGold)" stroke-width="4" />

    <!-- চিমনি -->
    <rect x="332" y="142" width="22" height="42" rx="6" fill="url(#whiteGlow)" stroke="url(#accentGold)" stroke-width="6" />

    <!-- ====== প্লেট ====== -->
    <circle cx="256" cy="310" r="68" fill="url(#plateGrad)" stroke="#cbd5e1" stroke-width="4" filter="url(#plateShadow)" />
    
    <!-- প্লেটের ভেতরের ডিজাইন রিং -->
    <circle cx="256" cy="310" r="52" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="256" cy="310" r="44" fill="none" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- ====== কাঁটা (Fork) ====== -->
    <g filter="url(#cutleryShadow)">
      <!-- হ্যান্ডেল -->
      <line x1="228" y1="288" x2="228" y2="358" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
      
      <!-- হ্যান্ডেলের মিডল ডেকোরেশন -->
      <line x1="228" y1="305" x2="228" y2="350" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- মাথা (৩টি দাঁত) -->
      <path d="M 216 264 V 282 C 216 290 240 290 240 282 V 264" fill="none" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" />
      <line x1="228" y1="264" x2="228" y2="288" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- দাঁতের ডগায় ছোট গোল -->
      <circle cx="220" cy="264" r="2.5" fill="#64748b" />
      <circle cx="228" cy="262" r="2.5" fill="#64748b" />
      <circle cx="236" cy="264" r="2.5" fill="#64748b" />
    </g>

    <!-- ====== চামচ (Knife - ডানদিকে) ====== -->
    <g filter="url(#cutleryShadow)">
      <!-- হ্যান্ডেল -->
      <line x1="284" y1="288" x2="284" y2="358" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
      
      <!-- হ্যান্ডেলের মিডল ডেকোরেশন -->
      <line x1="284" y1="305" x2="284" y2="350" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" />
      
      <!-- ব্লেড (ছুরির মাথা) -->
      <path d="M 284 288 C 284 254 266 254 266 254 V 288 Z" fill="#64748b" stroke="#475569" stroke-width="2" stroke-linejoin="round" />
      
      <!-- ব্লেডে হাইলাইট -->
      <path d="M 269 258 V 285" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    </g>

  </g>

  <!-- ✨ অ্যাপের নাম -->
  <text x="256" y="435" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="8" opacity="0.95">
    MY APP
  </text>

  <!-- সাবটেক্সট -->
  <text x="256" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#c7d2fe" text-anchor="middle" letter-spacing="3" opacity="0.7">
    HOME DINING
  </text>
</svg>