<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Emerald Green Gradient Background -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Plate Radial Gradient -->
    <radialGradient id="plateGradient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#appBg)" filter="url(#shadowFilter)" />
  <rect x="32" y="32" width="448" height="448" rx="92" ry="92" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2" />

  <!-- Main House Structure -->
  <g filter="url(#glowFilter)">
    <!-- House Roof & Body -->
    <path d="M 150 330 V 230 L 256 130 L 362 230 V 330 H 320 V 285 H 192 V 330 Z" 
          fill="#ffffff" stroke="url(#goldGradient)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

    <!-- House Door -->
    <path d="M 226 330 V 270 H 286 V 330" fill="none" stroke="url(#goldGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Dining Plate Symbol in Center -->
    <circle cx="256" cy="295" r="64" fill="url(#plateGradient)" stroke="#94a3b8" stroke-width="4" />
    <circle cx="256" cy="295" r="48" fill="none" stroke="#cbd5e1" stroke-width="2" />

    <!-- Fork (Left Side) -->
    <g transform="translate(225, 260)">
      <line x1="0" y1="20" x2="0" y2="55" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <path d="M -10 0 V 16 C -10 24 10 24 10 16 V 0" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="20" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Spoon (Right Side) -->
    <g transform="translate(287, 260)">
      <line x1="0" y1="20" x2="0" y2="55" stroke="#334155" stroke-width="5" stroke-linecap="round" />
      <ellipse cx="0" cy="10" rx="9" ry="14" fill="#334155" />
    </g>
  </g>

  <!-- App Title Banner -->
  <rect x="110" y="380" width="292" height="60" rx="20" fill="#064e3b" opacity="0.85" />
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="2">
    মেস হিসাব
  </text>
</svg>
